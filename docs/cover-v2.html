<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whale Soulmate · cover v2</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #030814;
      --navy: #06152f;
      --navy-2: #0a2451;
      --blue: #6eb6ff;
      --blue-soft: #a8d6ff;
      --gold: #e7c56f;
      --gold-soft: #fff0b5;
      --white: #f6f8ff;
      --muted: #9db1d4;
      --line: rgba(150, 197, 255, 0.24);
      --glass: rgba(7, 24, 54, 0.62);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
    }

    body {
      position: relative;
      isolation: isolate;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
        "Noto Sans CJK SC", "Segoe UI", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at 58% 48%, rgba(50, 119, 214, 0.32) 0%, rgba(11, 37, 81, 0.14) 38%, transparent 68%),
        radial-gradient(ellipse at 13% 18%, rgba(42, 104, 196, 0.18) 0%, transparent 36%),
        radial-gradient(ellipse at 88% 28%, rgba(217, 173, 80, 0.10) 0%, transparent 30%),
        linear-gradient(145deg, #020611 0%, #041127 36%, #071c3b 65%, #020712 100%);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: 0.32;
      background-image:
        linear-gradient(rgba(123, 179, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123, 179, 255, 0.055) 1px, transparent 1px);
      background-size: 4.2vh 4.2vh;
      mask-image: radial-gradient(circle at 58% 52%, black 0%, transparent 68%);
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      box-shadow:
        inset 0 0 10vw rgba(0, 0, 0, 0.72),
        inset 0 -8vh 13vh rgba(0, 2, 9, 0.82);
    }

    .starfield,
    .starfield::before,
    .starfield::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
    }

    .starfield {
      z-index: -2;
      opacity: 0.92;
      background-image:
        radial-gradient(circle at 8% 16%, rgba(255, 255, 255, 0.92) 0 1px, transparent 1.8px),
        radial-gradient(circle at 16% 69%, rgba(120, 191, 255, 0.9) 0 1.2px, transparent 2px),
        radial-gradient(circle at 24% 38%, rgba(255, 244, 198, 0.82) 0 1px, transparent 1.8px),
        radial-gradient(circle at 31% 12%, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.8px),
        radial-gradient(circle at 39% 80%, rgba(110, 182, 255, 0.72) 0 1px, transparent 1.8px),
        radial-gradient(circle at 47% 24%, rgba(255, 255, 255, 0.8) 0 1.2px, transparent 2px),
        radial-gradient(circle at 55% 64%, rgba(255, 227, 153, 0.8) 0 1px, transparent 1.8px),
        radial-gradient(circle at 63% 15%, rgba(160, 213, 255, 0.8) 0 1px, transparent 1.8px),
        radial-gradient(circle at 72% 74%, rgba(255, 255, 255, 0.75) 0 1.2px, transparent 2px),
        radial-gradient(circle at 81% 35%, rgba(255, 238, 181, 0.85) 0 1px, transparent 1.8px),
        radial-gradient(circle at 90% 20%, rgba(144, 205, 255, 0.8) 0 1px, transparent 1.8px),
        radial-gradient(circle at 94% 67%, rgba(255, 255, 255, 0.76) 0 1.1px, transparent 1.8px);
    }

    .starfield::before {
      inset: 8% 6% 10% 8%;
      opacity: 0.58;
      background-image:
        radial-gradient(circle at 10% 10%, #fff 0 0.9px, transparent 1.6px),
        radial-gradient(circle at 26% 74%, #9ed5ff 0 0.8px, transparent 1.5px),
        radial-gradient(circle at 43% 29%, #fff 0 1px, transparent 1.8px),
        radial-gradient(circle at 58% 88%, #ffe6a0 0 0.9px, transparent 1.6px),
        radial-gradient(circle at 77% 17%, #fff 0 0.8px, transparent 1.5px),
        radial-gradient(circle at 89% 62%, #9ed5ff 0 1px, transparent 1.8px);
    }

    .starfield::after {
      inset: 24% 12% 8% 24%;
      opacity: 0.26;
      background-image:
        radial-gradient(circle at 4% 20%, #fff 0 0.7px, transparent 1.3px),
        radial-gradient(circle at 33% 7%, #fff 0 0.7px, transparent 1.3px),
        radial-gradient(circle at 49% 68%, #ffe3a1 0 0.8px, transparent 1.4px),
        radial-gradient(circle at 66% 38%, #fff 0 0.7px, transparent 1.3px),
        radial-gradient(circle at 85% 82%, #9ed5ff 0 0.8px, transparent 1.4px);
    }

    .aurora {
      position: absolute;
      z-index: -1;
      width: 62vw;
      height: 24vw;
      left: 27%;
      top: 25%;
      border-radius: 50%;
      opacity: 0.25;
      filter: blur(5vw);
      transform: rotate(-13deg);
      background: linear-gradient(90deg, transparent 0%, #367fd4 28%, #7cbaff 48%, #d2ae5d 72%, transparent 100%);
      mix-blend-mode: screen;
    }

    .grid-horizon {
      position: absolute;
      z-index: -1;
      left: -8%;
      right: -8%;
      bottom: -2%;
      height: 33%;
      opacity: 0.24;
      transform: perspective(28vw) rotateX(67deg);
      transform-origin: center bottom;
      background-image:
        linear-gradient(rgba(112, 180, 255, 0.42) 1px, transparent 1px),
        linear-gradient(90deg, rgba(112, 180, 255, 0.34) 1px, transparent 1px);
      background-size: 3.7vw 3.7vw;
      mask-image: linear-gradient(to top, black 0%, transparent 88%);
    }

    .orbital {
      position: absolute;
      z-index: 1;
      left: 58%;
      top: 54%;
      width: 56vh;
      height: 56vh;
      border: 1px solid rgba(231, 197, 111, 0.30);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-17deg);
      box-shadow:
        0 0 0 1.2vh rgba(94, 169, 255, 0.025),
        0 0 8vh rgba(73, 151, 244, 0.15),
        inset 0 0 6vh rgba(230, 192, 102, 0.08);
    }

    .orbital::before,
    .orbital::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .orbital::before {
      inset: 7%;
      border: 1px dashed rgba(132, 195, 255, 0.25);
    }

    .orbital::after {
      inset: 18%;
      border: 1px solid rgba(255, 235, 174, 0.20);
      box-shadow: inset 0 0 5vh rgba(103, 180, 255, 0.12);
    }

    .orbit-dot {
      position: absolute;
      z-index: 2;
      width: 1.15vh;
      height: 1.15vh;
      min-width: 7px;
      min-height: 7px;
      border-radius: 50%;
      background: var(--gold-soft);
      box-shadow: 0 0 2.2vh rgba(255, 225, 137, 0.9);
    }

    .orbit-dot.one { left: 31%; top: 17%; }
    .orbit-dot.two { right: 18%; top: 43%; width: 0.85vh; height: 0.85vh; opacity: 0.8; }
    .orbit-dot.three { left: 48%; bottom: 9%; opacity: 0.55; }

    .topbar {
      position: absolute;
      z-index: 30;
      top: 5.2vh;
      left: 4.8vw;
      right: 4.8vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2vw;
    }

    .brandline {
      display: flex;
      align-items: center;
      gap: 1.1vw;
    }

    .deepseek-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.72vw;
      min-height: 4.8vh;
      padding: 0.45vh 1vw 0.45vh 0.48vw;
      border: 1px solid rgba(231, 197, 111, 0.40);
      border-radius: 1.25vh;
      background:
        linear-gradient(135deg, rgba(24, 61, 119, 0.82), rgba(4, 17, 42, 0.86));
      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.12),
        0 1vh 3vh rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
      white-space: nowrap;
    }

    .deepseek-glyph {
      display: grid;
      place-items: center;
      width: 3.7vh;
      height: 3.7vh;
      min-width: 28px;
      min-height: 28px;
      border: 1px solid rgba(164, 210, 255, 0.36);
      border-radius: 1vh;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.22), transparent 42%),
        linear-gradient(145deg, #2e79d7, #0a2a66 68%, #061634);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.18),
        0 0 2vh rgba(69, 151, 255, 0.26);
    }

    .deepseek-glyph svg {
      width: 76%;
      height: 76%;
      overflow: visible;
    }

    .deepseek-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1;
    }

    .deepseek-copy strong {
      color: #f6f9ff;
      font-size: clamp(12px, 0.92vw, 18px);
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .deepseek-copy small {
      margin-top: 0.44vh;
      color: var(--gold-soft);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: clamp(6px, 0.46vw, 9px);
      font-weight: 700;
      letter-spacing: 0.23em;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      height: 3.9vh;
      min-height: 30px;
      padding: 0 1.25vw;
      border: 1px solid rgba(143, 190, 255, 0.30);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(21, 51, 99, 0.70), rgba(4, 19, 44, 0.64));
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.10), 0 1vh 3vh rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(14px);
      white-space: nowrap;
    }

    .brand-pill {
      color: #dcecff;
      font-size: clamp(9px, 0.75vw, 14px);
      font-weight: 650;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand-pill::before {
      content: "";
      width: 0.65vw;
      height: 0.65vw;
      min-width: 5px;
      min-height: 5px;
      margin-right: 0.65vw;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 1.4vh rgba(255, 224, 137, 0.65);
    }

    .mini-wordmark {
      color: rgba(222, 237, 255, 0.72);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: clamp(9px, 0.66vw, 12px);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .hero-copy {
      position: absolute;
      z-index: 25;
      left: 5.1vw;
      top: 15.2vh;
      width: 40vw;
      max-width: 820px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.9vw;
      margin-bottom: 2.1vh;
      color: var(--blue-soft);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: clamp(10px, 0.78vw, 15px);
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 3.1vw;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), rgba(231, 197, 111, 0.08));
      box-shadow: 0 0 1.4vh rgba(231, 197, 111, 0.45);
    }

    h1 {
      margin: 0;
      font-size: clamp(63px, 6.35vw, 124px);
      line-height: 0.86;
      letter-spacing: -0.065em;
      font-weight: 900;
      text-wrap: balance;
      text-shadow: 0 1.5vh 5vh rgba(0, 0, 0, 0.48);
    }

    h1 .line-one {
      display: block;
      color: #f7fbff;
    }

    h1 .line-two {
      display: block;
      padding-top: 0.07em;
      color: transparent;
      background: linear-gradient(102deg, #fafdff 0%, #b9ddff 42%, #e7c56f 76%, #fff0b5 100%);
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0.8vh 2.4vh rgba(75, 153, 255, 0.16));
    }

    .cn-title {
      margin: 2.3vh 0 0;
      color: #eef7ff;
      font-size: clamp(22px, 1.9vw, 37px);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .summary {
      max-width: 38vw;
      margin: 1.25vh 0 0;
      color: var(--muted);
      font-size: clamp(12px, 1.03vw, 20px);
      line-height: 1.7;
      letter-spacing: 0.025em;
    }

    .summary strong {
      color: #dcecff;
      font-weight: 650;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 0.72vw;
      margin-top: 1.15vh;
    }

    .feature {
      display: inline-flex;
      align-items: center;
      gap: 0.55vw;
      min-height: 4.4vh;
      padding: 0 1.05vw;
      border: 1px solid rgba(141, 190, 255, 0.26);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(18, 48, 94, 0.72), rgba(7, 23, 50, 0.62));
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.08);
      color: #dbeaff;
      font-size: clamp(10px, 0.78vw, 15px);
      font-weight: 650;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    .feature i {
      width: 0.52vw;
      height: 0.52vw;
      min-width: 4px;
      min-height: 4px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 1.3vh rgba(255, 224, 137, 0.6);
    }

    .pet-stage {
      position: absolute;
      z-index: 12;
      inset: 0;
      pointer-events: none;
    }

    .pet-wrap {
      position: absolute;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      bottom: 2.1vh;
      filter: drop-shadow(0 2.2vh 2.3vh rgba(0, 0, 0, 0.48));
    }

    .pet-wrap img {
      display: block;
      width: auto;
      height: var(--pet-h);
      max-width: none;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .pet-wrap::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 50%;
      bottom: -0.4vh;
      width: 78%;
      height: 4.8vh;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(58, 143, 248, 0.28), rgba(4, 17, 39, 0) 68%);
      filter: blur(0.8vh);
    }

    .nameplate {
      position: relative;
      z-index: 4;
      margin-top: -0.1vh;
      padding: 0.55vh 0.78vw;
      border: 1px solid rgba(137, 188, 255, 0.25);
      border-radius: 999px;
      background: rgba(3, 15, 36, 0.80);
      box-shadow: 0 0.7vh 1.8vh rgba(0, 0, 0, 0.25);
      color: #cfe3ff;
      font-size: clamp(7px, 0.55vw, 11px);
      font-weight: 650;
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .pet-hanfu { left: 8.2%; --pet-h: 35vh; z-index: 7; bottom: 8.1vh; }
    .pet-deepsea { left: 20.2%; --pet-h: 45vh; z-index: 8; bottom: 3.5vh; }
    .pet-soda { left: 34.8%; --pet-h: 43vh; z-index: 7; bottom: 3.8vh; }
    .pet-butler { left: 56.8%; --pet-h: 68vh; z-index: 13; bottom: 1.4vh; }
    .pet-starnight { left: 73.2%; --pet-h: 49vh; z-index: 9; bottom: 3.1vh; }
    .pet-bluewinter { left: 85.8%; --pet-h: 35vh; z-index: 8; bottom: 4.2vh; }
    .pet-winterboy { left: 94.2%; --pet-h: 34vh; z-index: 9; bottom: 4.3vh; }

    .pet-butler .nameplate {
      margin-top: -0.5vh;
      padding: 0.7vh 1vw;
      border-color: rgba(231, 197, 111, 0.52);
      background: linear-gradient(180deg, rgba(64, 48, 15, 0.88), rgba(16, 19, 29, 0.86));
      color: var(--gold-soft);
      box-shadow: 0 0 2.4vh rgba(218, 175, 74, 0.20), 0 0.7vh 1.8vh rgba(0, 0, 0, 0.28);
    }

    .butler-aura {
      position: absolute;
      z-index: 10;
      left: 56.8%;
      bottom: 5vh;
      width: 34vh;
      height: 50vh;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(100, 176, 255, 0.20), rgba(231, 197, 111, 0.07) 42%, transparent 70%);
      filter: blur(1.8vh);
    }

    .floor {
      position: absolute;
      z-index: 5;
      left: -12%;
      right: -12%;
      bottom: -18vh;
      height: 36vh;
      border-radius: 50% 50% 0 0;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(86, 162, 255, 0.22), transparent 35%),
        linear-gradient(180deg, rgba(15, 44, 88, 0.50), rgba(1, 6, 15, 0.98) 64%);
      border-top: 1px solid rgba(173, 215, 255, 0.18);
      box-shadow: 0 -1.4vh 5vh rgba(82, 161, 255, 0.08);
    }

    .floor::before {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      top: 0.7vh;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(231, 197, 111, 0.72), transparent);
      box-shadow: 0 0 2.4vh rgba(231, 197, 111, 0.32);
    }

    .corner {
      position: absolute;
      z-index: 8;
      width: 5.8vw;
      height: 5.8vw;
      opacity: 0.42;
      border-color: rgba(143, 190, 255, 0.46);
    }

    .corner.tl { left: 2.2vw; top: 12.3vh; border-left: 1px solid; border-top: 1px solid; }
    .corner.br { right: 2.2vw; bottom: 2.3vh; border-right: 1px solid; border-bottom: 1px solid; }

    @media (max-aspect-ratio: 1.9/1) {
      .hero-copy {
        top: 15.5vh;
        width: 43vw;
      }

      .summary {
        max-width: 42vw;
      }

      .pet-hanfu { left: 6.4%; --pet-h: 30vh; bottom: 7.2vh; }
      .pet-deepsea { left: 17.5%; --pet-h: 36vh; bottom: 2.3vh; }
      .pet-soda { left: 29.5%; --pet-h: 35vh; bottom: 2.5vh; }
      .pet-butler { left: 54%; --pet-h: 67vh; }
      .pet-starnight { left: 70.5%; --pet-h: 44vh; }
      .pet-bluewinter { left: 83%; --pet-h: 32vh; }
      .pet-winterboy { left: 92.5%; --pet-h: 31vh; }
      .orbital { left: 55%; }
    }

    @media (min-aspect-ratio: 1.9/1) and (max-height: 800px) {
      .topbar {
        top: 4.4vh;
        left: 4.6vw;
        right: 4.6vw;
      }

      .brand-pill {
        height: 30px;
      }

      .deepseek-mark {
        min-height: 31px;
        padding: 3px 8px 3px 4px;
      }

      .deepseek-glyph {
        width: 25px;
        height: 25px;
        min-width: 25px;
        min-height: 25px;
      }

      .hero-copy {
        top: 13.5vh;
        left: 5.1vw;
        width: 89vw;
      }

      .eyebrow {
        display: none;
      }

      h1 {
        display: flex;
        align-items: baseline;
        gap: 0.13em;
        font-size: clamp(52px, 5.35vw, 72px);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      h1 .line-one,
      h1 .line-two {
        display: inline;
        padding: 0;
      }

      .cn-title {
        display: inline-block;
        margin: 0 0 0 1.2vw;
        font-size: clamp(17px, 1.65vw, 22px);
        vertical-align: 0.32em;
      }

      .summary {
        max-width: 85vw;
        margin-top: 0.45vh;
        font-size: clamp(11px, 1vw, 14px);
        line-height: 1.5;
      }

      .summary br {
        display: none;
      }

      .features {
        gap: 0.48vw;
        margin-top: 1.1vh;
      }

      .feature {
        min-height: 29px;
        padding: 0 0.9vw;
        font-size: clamp(9px, 0.82vw, 11px);
      }

      .feature i {
        width: 5px;
        height: 5px;
      }

      .pet-hanfu { left: 7.1%; --pet-h: 27vh; bottom: 7vh; }
      .pet-deepsea { left: 18.4%; --pet-h: 33vh; bottom: 2.3vh; }
      .pet-soda { left: 31.2%; --pet-h: 32vh; bottom: 2.5vh; }
      .pet-butler { left: 48.3%; --pet-h: 52vh; bottom: 0.7vh; }
      .pet-starnight { left: 64.2%; --pet-h: 34vh; bottom: 2vh; }
      .pet-bluewinter { left: 77.7%; --pet-h: 27vh; bottom: 3.1vh; }
      .pet-winterboy { left: 89.4%; --pet-h: 27vh; bottom: 3.1vh; }
      .orbital { left: 48%; top: 65%; width: 58vh; height: 58vh; }
      .butler-aura { left: 48.3%; bottom: 2.4vh; width: 31vh; height: 42vh; }
      .nameplate { padding: 3px 7px; font-size: clamp(7px, 0.64vw, 9px); }
    }

    @media (max-width: 900px) {
      .mini-wordmark,
      .nameplate {
        display: none;
      }
    }
  </style>
</head>

  <div class="aurora"></div>
  <div class="grid-horizon"></div>
  <div class="corner tl"></div>
